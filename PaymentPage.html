<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
</head>
<body>
    <form action="">
        <h1>Payment Page</h1>
        <p>Required details followed by *</p>
        <h2>Contact Info</h2>
        <p>Name:* <input type="text" name="name" required></p>
        <fieldset> <legend>Gender</legend>
        <p>
            Male <input type="radio" name="Gender" id="" required>
            Female <input type="radio" name="Gender" id="" required>
        </p>
        </fieldset>
        <p>Adress: <textarea name="adress" id="adress" cols="50" rows="9"></textarea></p>
        <p>Email:* <input type="email" name="email" id="email" required></p>
        <p>Pin Code:* <input type="number" name="pincode" id="pincode" required></p>
        <h2>Payment Info</h2>
        <p>Card Type:*
            <select name="card_type" id="card_type" required>
                <option value="">--Select a Card Type</option>
                <option value="visa">Visa</option>
                <option value="mastercard">Mastercard</option>
                <option value="rupay">Rupay</option>
            </select>
        </p>
        <p>Card Number:* <input type="number" name="card_number" id="card_number" required></p>
        <p>Experation Date:* <input type="date" name="exp_date" id="exp_date" required></p>
        <p>
            CVV:* <input type="password" name="cvv" id="cvv" required>
        </p>
        <input type="submit" value="Pay Now">
    </form>
</body>
</html>
